name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # The site is served from the root of its own domain
          SITE_BASE: /
          SITE_URL: https://video-nataceni.cz
          # Web3Forms public access key (meant for client-side code); messages go to info@video-nataceni.cz
          PUBLIC_CONTACT_ENDPOINT: https://api.web3forms.com/submit
          PUBLIC_CONTACT_KEY: a5c114d1-845b-4a4d-90b0-fe6c2a0c91a2
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
